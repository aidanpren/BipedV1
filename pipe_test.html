<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BipedV1 — dashboard (monitor)</title>

  <!-- roslibjs from a CDN for now. Needs internet on whatever machine opens
       the page. We'll vendor this .js locally later, for the offline robot. -->
  <script src="https://cdn.jsdelivr.net/npm/roslib@1/build/roslib.min.js"></script>

  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; }
    #status { font-weight: bold; }
    .ok  { color: green; }
    .bad { color: red; }
    h2 { margin-top: 1.5rem; font-size: .8rem; text-transform: uppercase;
         letter-spacing: .08em; color: #666; }
    .readout { display: flex; margin: .35rem 0; }
    .label { width: 14rem; color: #555; }
    .value { font-variant-numeric: tabular-nums; font-weight: 600; }
    .stub  { color: #999; font-weight: 400; }
  </style>
</head>
<body>
  <h1>BipedV1</h1>
  <p>Bridge: <span id="status" class="bad">connecting…</span></p>

  <h2>State</h2>
  <div class="readout"><span class="label">Mode</span><span class="value" id="mode">—</span></div>

  <h2>Balance</h2>
  <div class="readout"><span class="label">Pitch (rad)</span><span class="value" id="pitch">—</span></div>
  <div class="readout"><span class="label">Pitch rate (rad/s)</span><span class="value" id="pitchRate">—</span></div>

  <h2>Drive</h2>
  <div class="readout"><span class="label">Wheel position (m)</span><span class="value" id="wheelPos">—</span></div>
  <div class="readout"><span class="label">Wheel velocity (m/s)</span><span class="value" id="wheelVel">—</span></div>

  <h2>Power</h2>
  <div class="readout"><span class="label">Battery (V)</span><span class="value stub">N/A — needs Pico</span></div>
  <div class="readout"><span class="label">Current (A)</span><span class="value stub">N/A — needs Pico</span></div>

  <script>
    const WHEEL_RADIUS = 0.105;   // must match balance_controller

    // tiny helpers so the callbacks below stay readable
    const el  = (id) => document.getElementById(id);
    const set = (id, text) => { el(id).textContent = text; };

    // ---- connection -------------------------------------------------------
    // to open this on a PHONE later, swap localhost for the Pi's IP.
    const ros = new ROSLIB.Ros({ url: 'ws://localhost:9090' });

    ros.on('connection', () => {
      set('status', 'connected'); el('status').className = 'ok';
      console.log('rosbridge connected');
    });
    ros.on('error', (err) => {
      set('status', 'error (see console)'); el('status').className = 'bad';
      console.error('rosbridge error:', err);
    });
    ros.on('close', () => {
      set('status', 'closed'); el('status').className = 'bad';
      console.log('rosbridge connection closed');
    });

    // ---- /mode ------------------------------------------------------------
    const modeTopic = new ROSLIB.Topic({
      ros: ros, name: '/mode', messageType: 'std_msgs/msg/String',
    });
    modeTopic.subscribe((msg) => set('mode', msg.data));

    // ---- /imu -> pitch ----------------------------------------------------
    // identical math to balance_controller.imu_callback, ported to JS
    const imuTopic = new ROSLIB.Topic({
      ros: ros, name: '/imu', messageType: 'sensor_msgs/msg/Imu',
    });
    imuTopic.subscribe((msg) => {
      const q = msg.orientation;
      let sinp = 2.0 * (q.w * q.y - q.z * q.x);
      sinp = Math.max(-1.0, Math.min(1.0, sinp));   // clamp — same reason as Python
      set('pitch', Math.asin(sinp).toFixed(3));
      set('pitchRate', msg.angular_velocity.y.toFixed(3));
    });

    // ---- /joint_states -> wheel position & velocity -----------------------
    const jointTopic = new ROSLIB.Topic({
      ros: ros, name: '/joint_states', messageType: 'sensor_msgs/msg/JointState',
    });
    jointTopic.subscribe((msg) => {
      // parallel arrays: find each wheel by name, then index into position/velocity
      const l = msg.name.indexOf('left_wheel_joint');
      const r = msg.name.indexOf('right_wheel_joint');
      if (l === -1 || r === -1) return;   // JS version of your try/except ValueError

      const x = WHEEL_RADIUS * (msg.position[l] + msg.position[r]) / 2.0;
      const v = WHEEL_RADIUS * (msg.velocity[l] + msg.velocity[r]) / 2.0;
      set('wheelPos', x.toFixed(3));
      set('wheelVel', v.toFixed(3));
    });
  </script>
</body>
</html>
