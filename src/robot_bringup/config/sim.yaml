# ---------------------------------------------------------------------------
# SIM parameters. Loaded by sim.launch.py.
#
# Keep this file and real.yaml structurally identical for the nodes they share,
# so `diff sim.yaml real.yaml` shows exactly how the real robot differs from
# the model. That diff is data — it tells you where your sim is wrong.
#
# TYPES MATTER: a node that declares a double (20.0) will CRASH if handed a
# bare int (20). Every value below that ends in .0 must keep its .0.
#
# The top-level key is the NODE NAME (create_node('balance_controller')), not
# the executable name. They match today. If you ever launch a node with
# name='something_else', this key must change too or the params are silently
# ignored and the node quietly runs on its hardcoded defaults.
# ---------------------------------------------------------------------------

mode_manager:
  ros__parameters:
    # DS4 mode buttons. Kept structurally identical to real.yaml so the
    # `diff sim.yaml real.yaml` habit keeps working — and so a button index
    # learned in sim is the same one the robot uses.
    # See real.yaml for the full reasoning and the MEASURE-THESE warning.
    teleop_button: 9            # Options
    disable_buttons: [4, 6]     # L1 + L2 held together -> DISABLED

balance_controller:
  ros__parameters:
    # Inner loop: pitch -> wheel torque. Tuned in Gazebo 2026-07-13.
    k3: 20.0            # pitch gain
    k4: 2.0             # pitch-rate (damping) gain

    # Outer loop: position/velocity -> desired lean.
    # Sign verified 2026-07-13: POSITIVE a1/a2 = saturated-lean runaway,
    # NEGATIVE = station hold (given the plus-form control law in the node).
    # a1 and a2 are coupled, not independent:
    #   omega_n = sqrt(g*|a1|)      zeta = (|a2|/2) * sqrt(g/|a1|)
    # Retune them as a pair. See real.yaml for the derivation and for why
    # a2 also has a hard ceiling of its own (non-minimum-phase plant).
    a1: -0.07           # position -> lean
    a2: -0.15           # velocity -> lean

    k_yaw: 4.0          # yaw-rate gain (differential wheel torque)

    # Reference shaping (2026-08-01) — see real.yaml for the full rationale.
    accel_limit: 0.3      # m/s^2, ramp rate on v_cmd
    jerk_tau: 0.15        # s, smooths a_ref so the feedforward is not an edge
    accel_to_lean: 0.102  # rad per m/s^2 = 1/g, acceleration feedforward
    max_pos_error: 0.25   # m, anti-windup clamp on the reference position
    v_filter_tau: 0.06    # s, wheel-velocity low-pass time constant

    wheel_radius: 0.105 # m
    cutoff_pitch: 0.7   # rad

    # Safety saturations.
    max_lean: 0.3       # rad, cap on the outer loop's lean request
    max_torque: 40.0    # Nm at the OUTPUT shaft
