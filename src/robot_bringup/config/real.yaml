# ---------------------------------------------------------------------------
# REAL ROBOT parameters. Loaded by real.launch.py.
#
# Anything marked [SATURDAY] is a PLACEHOLDER that must be measured or
# confirmed against the physical robot during bring-up (2026-07-25). Do not
# trust these numbers until you have replaced them.
#
# TYPES MATTER: a node declaring a double (20.0) CRASHES if handed a bare int
# (20). Every value ending in .0 must keep its .0.
#
# Compare against sim.yaml — the diff on balance_controller is the record of
# how far the real robot drifted from the simulated model.
# ---------------------------------------------------------------------------

balance_controller:
  ros__parameters:
    # Starting point = the Gazebo-tuned gains. Expect to retune: the real
    # robot has different mass distribution, real friction, and IMU noise.
    k3: 20.0
    k4: 2.0
    a1: -0.05
    a2: -0.15
    k_yaw: 4.0
    max_lean: 0.3

    # [SATURDAY] DELIBERATELY LOW for first power-on. Raise only on purpose.
    #
    # Cross-check before raising -- the ODrive's CURRENT limit may bind first,
    # in which case this ceiling is fiction and never actually engages:
    #     max output torque = current_limit * (8.27 / motor_kv) * gear_ratio
    # With current_limit 12.0 and the PLACEHOLDER motor_kv 100, that is
    # ~7.9 Nm -- far below sim's 40.0. Confirm motor_kv from the GIM8108 spec
    # or measurement, then set this BELOW the computed ceiling so the
    # controller's own saturation is the thing that binds, not the ODrive's.
    max_torque: 4.0

odrive_bridge:
  ros__parameters:
    can_interface: 'socketcan'
    can_channel: 'can0'       # slcand names it can0 on the Pi
    bitrate: 500000

    # CONFIRMED on hardware 2026-07-29 via candump (heartbeat IDs 001/021/041/061).
    # Scheme: right wheel=0, right hip=1, left wheel=2, left hip=3.
    left_node_id: 2           # left wheel
    right_node_id: 0          # right wheel

    gear_ratio: 8.0           # velocity x8, torque /8 -- handled in odrive_can

    # [SATURDAY] Verify OPEN-LOOP, before balance_controller ever runs. A wrong
    # sign here makes the balance loop ADD energy to a fall instead of catching
    # it -- it diverges as fast as the motors allow.
    # CONFIRMED on hardware 2026-07-30. With left=false/right=true both wheels
    # drove BACKWARD together — already agreeing with each other, just the
    # wrong way round. So both signs flip; the left/right relationship was
    # never the problem.
    invert_left: true
    invert_right: false

    current_limit: 12.0       # A -- also sets the real torque ceiling, see above
    vel_limit: 20.0           # output rev/s
    publish_rate: 50.0        # Hz
    cmd_timeout: 0.5          # s; stale wheel torque -> COAST

leg_controller:
  ros__parameters:
    can_interface: 'socketcan'
    can_channel: 'can0'       # same bus as the wheels
    bitrate: 500000

    left_node_id: 3           # left hip  (confirmed on hardware 2026-07-29)
    right_node_id: 1          # right hip

    gear_ratio: 8.0
    invert_left: false        # [SATURDAY] verify open-loop
    invert_right: true        # [SATURDAY]

    # [SATURDAY] DELIBERATELY LOW for first powered motion, same doctrine as
    # balance_controller's max_torque. Under-current on a leg means SAG, not
    # breakage -- the safe direction to be wrong in. Raise on purpose once the
    # travel limits and zeroing are confirmed.
    current_limit: 5.0
    vel_limit: 5.0            # output turns/s
    publish_rate: 50.0

    # [SATURDAY] TRAVEL LIMITS -- measure the real mechanism before enabling.
    # These clamp commanded leg position. Too wide and the legs drive into
    # their hard stops under position control, which does not give up.
    #
    # 0.0 is the RETRACTED hard stop. THREE ceilings apply:
    #   * 0.1937 turns is the linkage toggle point (sin peaks at 90 deg);
    #     past it MORE turns means LESS extension and the map inverts.
    #   * 1/gear_ratio = 0.125 turns is ONE MOTOR TURN. The MA732 is
    #     single-turn absolute, so travel must fit inside one turn or two leg
    #     heights alias to the same boot reading and homing becomes mandatory.
    #   * the DEAD BAND left over after travel is the entire error budget for
    #     backlash/wind-up/noise when unwrapping the boot reading, and it is
    #     measured at the MOTOR, before the gearbox. At pos_max 0.12 it is
    #     0.0025 turns = 7 deg of motor rotation, which is nothing. At 0.10 it
    #     is 0.0125 turns = 36 deg. leg_controller warns below
    #     min_unwrap_margin and REFUSES to arm if it goes negative.
    # ext = 0.462*sin(20.28deg + 360deg*turns) m, so 0.10 turns gives
    # 0.160 m retracted -> 0.384 m extended (0.224 m of usable lift).
    #
    # [SATURDAY] RAISE ONLY AFTER the power-cycle test in HARDWARE_BRINGUP.md
    # shows what pos_estimate actually does across a reboot. If the fork
    # firmware persists a MULTI-TURN count, none of the single-turn reasoning
    # binds and this can go to ~0.19.
    pos_min: 0.0
    pos_max: 0.10
    min_unwrap_margin: 0.01   # output turns; warn below this
    home_position: 0.0        # start retracted; command up from there

    max_speed: 0.15           # output turns/s, ramp rate

    # [SATURDAY] ZEROING. Raw ODrive pos_estimate (OUTPUT turns) with each leg
    # against its RETRACTED hard stop. Measure ONCE: push the leg onto the
    # stop, read /leg_states with use_measured_zero false, record the raw
    # values from the node's warning line, paste them here, flip the flag.
    # After that the robot never homes again.
    use_measured_zero: false
    zero_raw_left: 0.0
    zero_raw_right: 0.0
    max_leg_mismatch: 0.03    # output turns; legs disagreeing more -> refuse to arm

    arm_timeout: 3.0          # s to wait for encoder feedback before refusing to arm

    input_mode: 3             # POS_FILTER (see odrive_can.InputMode)
    idle_on_shutdown: true

    # REMINDER: what actually holds the legs against gravity is
    # vel_integrator_gain, which lives in ODrive config (odrivetool), NOT here.
    # Damping only reduces sag; the integrator carries the weight.

imu_node:
  ros__parameters:
    # CONFIRMED on hardware 2026-07-30: the BNO085 is wired for I2C -- SDA on
    # pin 3 (GPIO2), SCL on pin 5 (GPIO3). It is NOT on the UART pins, so
    # driver:'uart' fails SILENTLY: the port opens, no data ever arrives, the
    # node logs nothing and /imu stays empty.
    #
    # TEMPORARY. I2C clock stretching on a Pi drops samples ("IMU read failed",
    # 20 ms gaps at 100 Hz) and that is not good enough to hold the robot up.
    # Rewire to UART before untethered running: sensor TX -> pin 10 (GPIO15 RX),
    # sensor RX -> pin 8 (GPIO14 TX), and strap PS1 HIGH / PS0 LOW -- the
    # BNO085 boots into I2C mode otherwise. /dev/ttyAMA0 is enabled and free.
    driver: 'i2c'             # uart | spi | i2c | fake
    port: '/dev/ttyAMA0'      # only used when driver is 'uart'
    baud: 3000000
    i2c_address: 0x4A
    frame_id: 'imu_link'
    publish_rate: 100.0

    # [SATURDAY] Rotation taking SENSOR axes -> ROBOT axes, as [r, p, y] rad.
    # Identity is almost certainly WRONG once the board is bolted in. Verify on
    # a bench BEFORE torque is ever enabled: a bad mount rotation feeds the
    # balance loop a mis-signed pitch, which fails the same way a wrong
    # invert_* does.
    mount_rpy: [0.048811, 0.017257, 3.107371]

