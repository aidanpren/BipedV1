# ---------------------------------------------------------------------------
# REAL ROBOT parameters. Loaded by real.launch.py.
#
# Anything marked [SATURDAY] is a PLACEHOLDER that must be measured or
# confirmed against the physical robot during bring-up (2026-07-25). Do not
# trust these numbers until you have replaced them.
#
# TYPES MATTER: a node declaring a double (20.0) CRASHES if handed a bare int
# (20). Every value ending in .0 must keep its .0.
#
# Compare against sim.yaml — the diff on balance_controller is the record of
# how far the real robot drifted from the simulated model.
# ---------------------------------------------------------------------------

balance_controller:
  ros__parameters:
    # Starting point = the Gazebo-tuned gains. Expect to retune: the real
    # robot has different mass distribution, real friction, and IMU noise.
    k3: 20.0
    k4: 2.0

    # RETUNED 2026-08-01 as a PAIR. The outer loop is second order:
    #     omega_n = sqrt(g*|a1|)        zeta = (|a2|/2) * sqrt(g/|a1|)
    # so a1 and a2 are not independent knobs and tuning one alone always
    # disappoints.
    #
    # The driving loop is v_dot = g*|a2|*(v_ref - v), i.e. a bandwidth of
    # g*|a2| rad/s. A balancer is non-minimum-phase (it drives its wheels
    # backward to lean forward), which caps usable bandwidth at roughly
    # sqrt(g/l_com)/4 ~ 1.6 rad/s for this robot. a2 = -0.3 demands 2.9 rad/s
    # -- about twice the physical ceiling. That, not a bad gain elsewhere,
    # is what made acceleration surge.
    #
    #   old  -0.09/-0.3   omega_n 0.94  zeta 1.57  slow pole tau 3.0 s
    #   new  -0.07/-0.15  omega_n 0.83  zeta 0.89  poles    tau 1.4 s
    #
    # Halving a2 halves the driving bandwidth to 1.5 rad/s (inside the
    # ceiling) and dropping a1 with it leaves station keeping better damped
    # AND twice as quick to return. There was never a trade-off here.
    # 2026-08-02: a2 -0.15 -> -0.18 on hardware. Raises zeta 0.89 -> 1.07 to
    # damp the +-0.25 m station-keeping limit cycle. -0.20 is the ceiling.
    # 2026-08-02 (later): that "limit cycle" turned out to be a ~0.5 Nm
    # friction DEAD ZONE (measured — see odrive_bridge's friction block), so
    # -0.18 was damping tuned against a ghost. With friction compensated,
    # -0.12 (zeta 0.71, lightly underdamped) station-keeps without the rock
    # and recovers faster. If a2 ever needs retuning, do it WITH friction
    # comp active, or it lands back at the wrong value.
    a1: -0.07
    a2: -0.12

    k_yaw: 4.0
    max_lean: 0.3

    # ── yaw shaping (added 2026-08-02) ─────────────────────────────────────
    # Closes the KNOWN GAP that stood since bring-up: linear.x got two stages
    # of shaping and yaw got none, so a stick flick delivered
    # k_yaw * scale_angular.yaw = 4.0 * 0.75 = 3.0 Nm of DIFFERENTIAL torque
    # in a single tick, out of a max_torque of 8.0 that yaw SHARES with
    # balancing.
    #
    # 2.0 rad/s^2 bounds the torque slew to k_yaw * 2.0 * dt = 0.08 Nm/tick at
    # 100 Hz — the same slew the linear path achieves with both of its stages.
    # Full-stick ramp: 0.75 / 2.0 = 0.375 s.
    #
    # TUNING: lower it if hard turns disturb the pitch loop; raise it if
    # steering feels mushy. This is the knob to reach for BEFORE raising
    # scale_angular.yaw, because it changes how abruptly the turn is
    # requested, not how sharp the turn ultimately is.
    # 2026-08-02: 2.0 felt mushy on hardware -> 5.0. Slew is now
    # k_yaw * 5.0 * dt = 0.2 Nm/tick, full-stick ramp 0.15 s.
    yaw_accel_limit: 5.0      # rad/s^2

    # ── reference shaping (added 2026-08-01) ───────────────────────────────
    # Ramp rate for v_cmd. RAISED 0.3 -> 0.45 on 2026-08-01 alongside the 50%
    # teleop scale increase, so full-stick ramp time stays 0.225/0.45 = 0.5 s.
    # Costs 0.45/9.81 = 0.046 rad (2.6 deg) of lean while accelerating, well
    # inside max_lean 0.3.
    accel_limit: 0.45         # m/s^2

    # Jerk limit. NOT optional: rate-limiting velocity alone turns acceleration
    # into a square wave, and accel_to_lean puts acceleration straight into
    # torque, so without this the step just moves from v to a. Offline sim:
    # peak torque slew 0.663 Nm/tick without, 0.074 Nm/tick with.
    # RAISE for a softer, lazier throttle; lower for a crisper one.
    # 2026-08-02: 0.15 -> 0.3 on hardware; the softer throttle drove better.
    jerk_tau: 0.3             # s

    # 1/g. Holding a lean theta accelerates the robot at a = g*tan(theta) ~
    # g*theta, so the lean needed for a commanded acceleration is a/9.81.
    # This is FEEDFORWARD of a quantity we already know, exactly like
    # pitch_trim -- not a tuned gain. It is what lets a2 stay small: without
    # it the cruise lean has to come from a banked position error of
    # a_ref/(g*|a1|) = 0.44 m, which is repaid as a lurch when you centre the
    # stick.
    # SET TO 0.0 to disable the feedforward and leave everything else intact.
    # It is live-tunable, so that is a safe first experiment.
    accel_to_lean: 0.102      # rad per m/s^2

    # Anti-windup: how far the reference position may lead the robot. Every
    # centimetre past this is distance the robot would sprint to recover after
    # being blocked or held.
    # 2026-08-02: 0.25 -> 0.5 on hardware. At 0.25 `err` sat PINNED at the rail
    # during station keeping, which froze the position term at a1*0.25 = 0.0175
    # rad -- about 1 deg of restoring lean out of the 17 deg max_lean allows --
    # and then dragged x_home along behind the drifting robot. Note that at
    # v_cmd = 0 there is no windup to prevent anyway: x_home does not move on
    # its own, so the clamp only ever pulled home toward a robot that was
    # already leaving. Revisit if a blocked-then-released robot sprints.
    max_pos_error: 0.5        # m

    # Wheel-velocity low-pass, as a TIME CONSTANT (see balance_controller).
    # The old hardcoded 0.85/0.15 was 123 ms at the 50 Hz odrive_bridge
    # actually publishes. RAISE THIS if the standstill stiction rocking gets
    # worse; lower it if driving still feels laggy.
    v_filter_tau: 0.06        # s

    wheel_radius: 0.105       # m
    cutoff_pitch: 0.7         # rad; beyond this the robot is down, cut torque

    # [SATURDAY] Chassis pitch where the CoM sits over the contact patch, rad.
    # POSITIVE = nose-down. A back-heavy robot needs a positive trim; leave it
    # at 0.0 and the inner loop holds pitch=0, gravity pulls constantly, and
    # the robot accelerates BACKWARD forever. That is not a tuning fault and no
    # k3/k4 fixes it.
    # MEASURE: power off, balance the robot by hand on its wheels until it
    # neither wants to tip forward nor back, and read pitch from
    # `python3 tools/imu_calibrate.py --watch`.
    # UNITS: --watch prints DEGREES, this field is RADIANS. DIVIDE BY 57.3.
    # Expect +1 to +6 deg on the watch line => 0.02-0.10 here.
    # It is live-tunable while balancing (`ros2 param set`), so measure by hand
    # for a starting value, then nudge: drifts backward -> increase this.
    #
    # This is FEEDFORWARD of a known constant, not a gain. The outer loop
    # cannot replace it: a1 is PROPORTIONAL on position, and a P term converts
    # a constant disturbance into a constant ERROR rather than removing it.
    # Leaving this at 0.0 makes the robot station-keep at an offset of
    # pitch_trim/a1 = 0.05/-0.05 = ONE METRE from home, permanently.
    # MEASURED 2026-08-02 by the bracketing method above: 0.08 drifted BACKWARD
    # (err mean -0.196), 0.094 drifted FORWARD (+0.090), 0.090 centred it
    # (+0.021). Then the leg bolts were found LOOSE and tightened, which moved
    # the CoM and the trim with it: 0.090 -> 0.06. Re-measure after ANY
    # mechanical work on the legs -- this value tracks the chassis, not the
    # controller, and every trim reading taken before that fix was against a
    # chassis that was quietly changing shape.
    # 2026-08-02 (later): 0.06 -> 0.057 with friction comp live — a
    # compensated dead zone stops masking the last sliver of trim error.
    pitch_trim: 0.057

    # MEASURED on hardware 2026-07-31:
    #     odrv0.axis0.motor.config.torque_constant = 0.43 Nm/A  (motor shaft)
    #     => motor_kv = 8.27 / 0.43 = 19.2, NOT the placeholder 100
    #     => output ceiling = 0.43 * current_limit 12.0 * gear_ratio 8 = 41.3 Nm
    # So the ODrive's current limit does NOT bind first, and sim's 40.0 was
    # about right all along. The old "deliberately low" 4.0 was low by 10x.
    #
    # What this value really sets is WHERE THE CONTROLLER SATURATES. With
    # k3 = 20, torque = 20 * pitch, so saturation happens at pitch =
    # max_torque / 20 rad. At 2.0 that is 5.7 deg -- flat out before the robot
    # has meaningfully begun to fall. At 8.0 it is 23 deg, past anything
    # recoverable. Start at 8.0 for the first ground test; there is headroom
    # to 41.3 but no reason to hand it over before the gains are trusted.
    max_torque: 8.0

mode_manager:
  ros__parameters:
    # ── DS4 mode buttons (added 2026-08-02) ──────────────────────────────────
    # THE ROBOT BOOTS INTO DISABLED. These buttons are how you leave it without
    # a laptop, which is what makes the robot standalone at all.
    #
    # [MEASURE THESE] The indices below are the common joydev DS4 layout and
    # are a STARTING GUESS. DS4 numbering differs between the SDL and joydev
    # backends, and a wrong index does NOT error — the button just never fires,
    # which looks exactly like a broken feature. Measure with:
    #     python3 tools/joy_probe.py
    # Reference guess:  4=L1  5=R1  6=L2  7=R2  9=Options
    #
    # This block is loaded from SOURCE (--params-file), so changing an index is
    # edit + restart the node. NO colcon build. That is deliberate: finding the
    # right number is a guess-and-check loop and a rebuild in the middle of it
    # is how you end up testing the old value.

    # Single tap -> TELEOP. The robot starts actively balancing at this moment,
    # so it is the "explicit command" CLAUDE.md requires before torque.
    # Keep it clear of teleop_twist_joy's enable_button(7)/enable_turbo(5).
    teleop_button: 9            # Options

    # ALL of these held at once -> DISABLED. A combo, not a single button,
    # because DISABLED cuts torque and DROPS THE ROBOT — it must not be
    # reachable by one fat finger while driving. L1+L2 puts the mode gestures
    # on the left hand; enable/turbo are on the right.
    #
    # These are BUTTON indices. If your driver exposes L2 only as an analog
    # AXIS (joy_probe will show you), pick a different digital button rather
    # than adding a threshold — a threshold can drift, a button cannot.
    disable_buttons: [4, 6]     # L1 + L2

odrive_bridge:
  ros__parameters:
    can_interface: 'socketcan'
    can_channel: 'can0'       # slcand names it can0 on the Pi
    bitrate: 500000

    # CONFIRMED on hardware 2026-07-29 via candump (heartbeat IDs 001/021/041/061).
    # Scheme: right wheel=0, right hip=1, left wheel=2, left hip=3.
    left_node_id: 2           # left wheel
    right_node_id: 0          # right wheel

    gear_ratio: 8.0           # velocity x8, torque /8 -- handled in odrive_can

    # [SATURDAY] Verify OPEN-LOOP, before balance_controller ever runs. A wrong
    # sign here makes the balance loop ADD energy to a fall instead of catching
    # it -- it diverges as fast as the motors allow.
    # CONFIRMED on hardware 2026-07-30. With left=false/right=true both wheels
    # drove BACKWARD together — already agreeing with each other, just the
    # wrong way round. So both signs flip; the left/right relationship was
    # never the problem.
    invert_left: true
    invert_right: false

    current_limit: 12.0       # A -- also sets the real torque ceiling, see above
    vel_limit: 20.0           # output rev/s
    publish_rate: 50.0        # Hz
    cmd_timeout: 0.5          # s; stale wheel torque -> COAST

    # ── friction compensation (added 2026-08-02) ──────────────────────────
    # For the symptom: balances in place but cannot hold still — leans, wheels
    # don't respond, leans further, breaks free and over-corrects. Bounded
    # hunting in a RANDOM direction that always recovers = symmetric stiction
    # deadband. (A consistent direction would be BIAS instead: check
    # pitch_trim and the IMU, not this.)
    #
    # BOTH DEFAULT 0.0 = OFF. Leave them off until measured. All four are read
    # live, so tune with `ros2 param set /odrive_bridge <name> <value>` while
    # the robot is balancing — no restart, no rebuild.
    #
    # USEFUL CALIBRATION, from Kt = 0.43 Nm/A x gear 8 = 3.44 Nm/A at the wheel
    # and k3 = 20 Nm/rad:
    #     0.35 Nm of breakaway  ~=  0.1 A of Iq  ~=  1 deg of pitch deadband
    # So if the robot hunts over roughly +/-2 deg, expect breakaway near 0.7 Nm.
    #
    # HOW TO TUNE, in this order:
    #  1. dither_torque FIRST — it is what fixes STANDSTILL. Raise from 0.0 in
    #     0.05 Nm steps until the hunting stops. Expect to land somewhere near
    #     breakaway. Too much = audible buzz and wasted heat, not instability.
    #  2. friction_ff SECOND — it does nothing at standstill (friction opposes
    #     MOTION, and there is none yet); it is what makes DRIVING smooth.
    #     Set to ~70% of measured breakaway and do not exceed it. This term is
    #     POSITIVE VELOCITY FEEDBACK: it pushes in the direction the wheel is
    #     already going. Below true friction it cancels drag; ABOVE it, the
    #     surplus accelerates the wheel and the balance loop has to fight its
    #     own actuator. Symptom of overshoot is low-speed creep or surging
    #     once rolling. Deliberately under-compensate.
    #  3. friction_v_eps last, and only if low-speed driving feels notchy.
    #
    # SAFETY: exactly [0.0, 0.0] from balance_controller passes through
    # uncompensated, so DISABLED stays truly silent no matter what these are
    # set to. Do not remove that branch in odrive_bridge.
    # MEASURED 2026-08-02 with tools/analyze_rock.py on three station-keep
    # bags (figures in rock_analysis/): breakaway is ~0.5 Nm common-mode at
    # the wheel — commanded torque square-waved at +-0.3-0.5 Nm producing ZERO
    # wheel accel (the cross-plot lobes), wheels dwelt motionless 8% of the
    # time vs 1.5% for a clean oscillation. The slow ~12 s / +-0.19 m
    # station-keep rock WAS this dead zone limit-cycling the outer loop:
    # 0.5 Nm / k3 = 1.4 deg of dead band predicts +-0.21 m, matching. The old
    # timid values (ff 0.1, dither 0.15) were 3-5x below breakaway, which is
    # why the rock looked immune to friction compensation.
    friction_ff: 0.35         # Nm at the wheel; 70% of measured breakaway,
                              # per the never-exceed-it rule above
    friction_v_eps: 0.3       # rad/s; taper width through zero
    dither_torque: 0.25       # Nm at the wheel; for STANDSTILL
                              # 0.15 was timid vs 0.5 breakaway; 0.4 visibly
                              # shakes the frame. 0.25 with ff carrying the
                              # moving regime is the 2026-08-02 sweet spot.
    dither_hz: 25.0           # Hz; do NOT raise toward 50 -- see dither()

odrive_telemetry:
  ros__parameters:
    # ── READ-ONLY electrical telemetry (added 2026-08-03) ──────────────────
    # Fixes the dashboard's "Battery / Current / Source: needs Pico" stubs,
    # which were never true: every ODrive already measures the DC bus it is
    # powered from, and Get_Bus_Voltage_Current (0x017) hands it over for the
    # cost of one CAN frame. There is no separate battery sensor and there does
    # not need to be.
    #
    # This node NEVER TRANSMITS A COMMAND. It sends RTR read requests and
    # listens to the heartbeats the ODrives broadcast anyway. Check it yourself:
    # every bus.send in odrive_telemetry.py goes through client.request().
    can_interface: 'socketcan'
    can_channel: 'can0'
    bitrate: 500000

    # PARALLEL ARRAYS — entry i of one goes with entry i of the other, and the
    # node refuses to start if the lengths disagree. Node IDs confirmed on
    # hardware 2026-07-29 via candump (heartbeats 001/021/041/061).
    # The hips are listed even though leg_controller is not launched: nothing
    # else watches them, and "is the hip drawing current while idle?" is
    # exactly the question this node exists to answer.
    axis_names: ['right_wheel', 'right_hip', 'left_wheel', 'left_hip']
    axis_node_ids: [0, 1, 2, 3]

    # MEASURED on hardware 2026-07-31 (odrv0.axis0.motor.config.torque_constant).
    # The one number converting the amps read here into the newton-metres the
    # rest of the stack speaks. Wrong here = every torque readout wrong by a
    # constant factor, while looking entirely plausible.
    torque_constant: 0.43     # Nm per motor amp
    gear_ratio: 8.0

    # 5 Hz = 16 frames/s against odrive_bridge's ~200. The bus belongs to the
    # balance loop first. Raise it temporarily to hunt a current spike; put it
    # back afterwards.
    publish_rate: 5.0         # Hz

    # Ten missed heartbeats. Long enough that bus contention never trips it,
    # short enough to notice a motor losing power while you watch the screen.
    offline_timeout: 1.0      # s

dashboard_backend:
  ros__parameters:
    # ── the filesystem/shell half of the dashboard (added 2026-08-03) ──────
    # Serves the Deploy tile (git pull / colcon build / restart the stack) and
    # the Save tile (write live tuning back into THIS file). A web page has
    # neither a shell nor a filesystem; this node is where both live.

    # EMPTY MEANS AUTO-DISCOVER, and auto is right on both machines: the node
    # honours $BIPED_WS (which /etc/default/biped sets on the Pi) and otherwise
    # walks up from its own realpath looking for a directory holding both src/
    # and .git. Set it only if you have moved the workspace somewhere unusual.
    workspace: ''

    # The files Save is allowed to rewrite. This is also the ALLOWLIST — a node
    # whose parameters are not in one of these files cannot be saved, so a
    # stray service call cannot reach anything else on the Pi. Paths are
    # relative to the workspace.
    #
    # NOTE the second entry is a SHARE-loaded file (see the
    # params-share-vs-source-yaml note): editing it needs a colcon build before
    # a restart picks it up, whereas this file is loaded from source. Saving to
    # it still does the right thing — the values are already live in the node —
    # but the change only survives a restart after a build.
    config_files:
      - 'src/robot_bringup/config/real.yaml'
      - 'src/robot_teleop/config/teleop_twist_joy.yaml'

    stack_service: 'biped-stack.service'
    git_remote: 'origin'
    git_branch: ''            # empty = whatever branch is checked out
    build_args: ['--symlink-install']

    # SAFETY GATE. Build and restart both kill balance_controller and idle the
    # wheel axes, which on a balancing robot is not a restart — it is dropping
    # it from standing height, from a button on a phone. With this true they
    # refuse unless /mode says disabled, and an UNKNOWN mode counts as unsafe
    # (no /mode means mode_manager is not running, which is the worst possible
    # moment to guess).
    #
    # SET FALSE ONLY for bench work with the motors unpowered. `git pull` is
    # never gated — it rewrites files, and the running nodes already hold their
    # code in memory.
    require_disabled: true

    pull_timeout: 180.0       # s
    build_timeout: 1800.0     # s; a cold full build of this workspace is slow

leg_controller:
  ros__parameters:
    # ─────────────────────────────────────────────────────────────────────────
    # NOT LAUNCHED BY DEFAULT since 2026-08-02. real.launch.py declares
    # `legs` (default FALSE) and this node only runs with legs:=true.
    #
    # So: EDITING ANYTHING IN THIS BLOCK HAS NO EFFECT on a normal run. That is
    # deliberate, and it is the failure mode to watch for here — a tuning
    # change that "didn't take" because the node was never started, which looks
    # exactly like a value that didn't load.
    #
    # These params are kept, not deleted: they are the accumulated measurements
    # and reasoning for leg bring-up, and they are what the eventual leg test
    # will load. Everything marked [SATURDAY] is still unmeasured.
    #
    # Do NOT bring the legs up by flipping legs:=true on the full stack. That
    # runs them inside the balance loop on a robot that has never moved them.
    # See HARDWARE_BRINGUP.md for the staged, legs-alone procedure.
    # ─────────────────────────────────────────────────────────────────────────
    can_interface: 'socketcan'
    can_channel: 'can0'       # same bus as the wheels
    bitrate: 500000

    left_node_id: 3           # left hip  (confirmed on hardware 2026-07-29)
    right_node_id: 1          # right hip

    gear_ratio: 8.0
    invert_left: false        # [SATURDAY] verify open-loop
    invert_right: true        # [SATURDAY]

    # [SATURDAY] DELIBERATELY LOW for first powered motion, same doctrine as
    # balance_controller's max_torque. Under-current on a leg means SAG, not
    # breakage -- the safe direction to be wrong in. Raise on purpose once the
    # travel limits and zeroing are confirmed.
    current_limit: 5.0
    vel_limit: 5.0            # output turns/s
    publish_rate: 50.0

    # [SATURDAY] TRAVEL LIMITS -- measure the real mechanism before enabling.
    # These clamp commanded leg position. Too wide and the legs drive into
    # their hard stops under position control, which does not give up.
    #
    # 0.0 is the RETRACTED hard stop. THREE ceilings apply:
    #   * 0.1937 turns is the linkage toggle point (sin peaks at 90 deg);
    #     past it MORE turns means LESS extension and the map inverts.
    #   * 1/gear_ratio = 0.125 turns is ONE MOTOR TURN. The MA732 is
    #     single-turn absolute, so travel must fit inside one turn or two leg
    #     heights alias to the same boot reading and homing becomes mandatory.
    #   * the DEAD BAND left over after travel is the entire error budget for
    #     backlash/wind-up/noise when unwrapping the boot reading, and it is
    #     measured at the MOTOR, before the gearbox. At pos_max 0.12 it is
    #     0.0025 turns = 7 deg of motor rotation, which is nothing. At 0.10 it
    #     is 0.0125 turns = 36 deg. leg_controller warns below
    #     min_unwrap_margin and REFUSES to arm if it goes negative.
    # ext = 0.462*sin(20.28deg + 360deg*turns) m, so 0.10 turns gives
    # 0.160 m retracted -> 0.384 m extended (0.224 m of usable lift).
    #
    # [SATURDAY] RAISE ONLY AFTER the power-cycle test in HARDWARE_BRINGUP.md
    # shows what pos_estimate actually does across a reboot. If the fork
    # firmware persists a MULTI-TURN count, none of the single-turn reasoning
    # binds and this can go to ~0.19.
    pos_min: 0.0
    pos_max: 0.10
    min_unwrap_margin: 0.01   # output turns; warn below this
    home_position: 0.0        # start retracted; command up from there

    max_speed: 0.15           # output turns/s, ramp rate

    # [SATURDAY] ZEROING. Raw ODrive pos_estimate (OUTPUT turns) with each leg
    # against its RETRACTED hard stop. Measure ONCE: push the leg onto the
    # stop, read /leg_states with use_measured_zero false, record the raw
    # values from the node's warning line, paste them here, flip the flag.
    # After that the robot never homes again.
    use_measured_zero: false
    zero_raw_left: 0.0
    zero_raw_right: 0.0
    max_leg_mismatch: 0.03    # output turns; legs disagreeing more -> refuse to arm

    arm_timeout: 3.0          # s to wait for encoder feedback before refusing to arm

    input_mode: 3             # POS_FILTER (see odrive_can.InputMode)
    idle_on_shutdown: true

    # REMINDER: what actually holds the legs against gravity is
    # vel_integrator_gain, which lives in ODrive config (odrivetool), NOT here.
    # Damping only reduces sag; the integrator carries the weight.

imu_node:
  ros__parameters:
    # CONFIRMED on hardware 2026-07-30: the BNO085 is wired for I2C -- SDA on
    # pin 3 (GPIO2), SCL on pin 5 (GPIO3). It is NOT on the UART pins, so
    # driver:'uart' fails SILENTLY: the port opens, no data ever arrives, the
    # node logs nothing and /imu stays empty.
    #
    # TEMPORARY. I2C clock stretching on a Pi drops samples ("IMU read failed",
    # 20 ms gaps at 100 Hz) and that is not good enough to hold the robot up.
    # Rewire to UART before untethered running: sensor TX -> pin 10 (GPIO15 RX),
    # sensor RX -> pin 8 (GPIO14 TX), and strap PS1 HIGH / PS0 LOW -- the
    # BNO085 boots into I2C mode otherwise. /dev/ttyAMA0 is enabled and free.
    driver: 'i2c'             # uart | spi | i2c | fake
    port: '/dev/ttyAMA0'      # only used when driver is 'uart'
    baud: 3000000
    i2c_address: 0x4A
    frame_id: 'imu_link'
    publish_rate: 100.0

    # [SATURDAY] Rotation taking SENSOR axes -> ROBOT axes, as [r, p, y] rad.
    # Identity is almost certainly WRONG once the board is bolted in. Verify on
    # a bench BEFORE torque is ever enabled: a bad mount rotation feeds the
    # balance loop a mis-signed pitch, which fails the same way a wrong
    # invert_* does.
    mount_rpy: [-0.051677, 0.016108, 3.107462]

