teleop_twist_joy_node:
  ros__parameters:
    axis_linear:
      x: 1
    scale_linear:
      x: 2.0
    scale_linear_turbo:
      x: 3.0
    axis_angular:
      yaw: 0
    scale_angular:
      yaw: 4.0
    enable_button: 7
    enable_turbo_button: 5
    # plain Twist end-to-end: the balance controller subscribes geometry_msgs/Twist
    publish_stamped_twist: false