teleop_twist_joy_node:
  ros__parameters:
    axis_linear:
      x: 1
    # REDUCED for first hardware drive 2026-08-01. Were 2.0 / 3.0 / 4.0 —
    # Gazebo values. Full stick at 2.0 m/s commanded a lean of
    # a2*(0 - 2.0) = 0.3 rad, which IS max_lean: an instant 17 deg lean
    # demand on a robot that had balanced for one session.
    #
    # RAISED 50% on 2026-08-01 after TEST 3/4 passed on the unified law.
    # The original reason for 0.15 was that a full-stick STEP went straight
    # into a proportional term. balance_controller now rate- and jerk-limits
    # the reference, so stick travel sets a target rather than a shock, and
    # the driving-loop stability margin is set by a2 (bandwidth g*|a2|), not
    # by top speed. Raising speed does not move the stability boundary.
    #
    # accel_limit was raised to match (0.3 -> 0.45 m/s^2 in real.yaml), so
    # full-stick ramp time is unchanged at 0.225/0.45 = 0.5 s.
    scale_linear:
      x: 0.5
    scale_linear_turbo:
      x: 0.75
    axis_angular:
      yaw: 0
    # YAW IS RATE-LIMITED as of 2026-08-02 (it was not, before). This value is
    # the top turn rate; `yaw_accel_limit` in real.yaml governs how fast the
    # robot is allowed to GET there, and that is the knob to touch first if
    # turning upsets the pitch loop.
    #
    # The old hazard this replaced: yaw_ref reached the law as a step, so a
    # flick put k_yaw*0.75 = 3.0 Nm of differential torque on the wheels in one
    # tick. Yaw and balance still share the 8.0 Nm max_torque, but they no
    # longer share it blindly — balance_controller now spends it in priority
    # order (balance first, yaw gets the headroom) instead of clamping each
    # wheel independently and letting a hard turn quietly eat balance torque.
    scale_angular:
      yaw: 0.75
    enable_button: 7
    enable_turbo_button: 5
    # plain Twist end-to-end: the balance controller subscribes geometry_msgs/Twist
    publish_stamped_twist: false