twist_mux:
    ros__parameters:
      # plain Twist end-to-end (must match teleop's publish_stamped_twist: false
      # and the balance controller's geometry_msgs/Twist subscription)
      use_stamped: false
      topics:
        joystick:
          topic : joy_vel
          timeout : 0.5
          priority : 10
        navigation:
          topic : nav_vel
          timeout : 0.5
          priority : 1