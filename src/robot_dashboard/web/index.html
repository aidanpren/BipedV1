<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>BipedV1 — dashboard</title>

  <!-- Everything is vendored. The robot has no internet when it is running as
       its own access point, which is precisely when you need the dashboard, so
       a CDN link would work on the bench and fail in the field. -->
  <link rel="stylesheet" href="css/dashboard.css" />
  <script src="roslib.min.js"></script>
</head>
<body>

<header class="topbar">
  <span class="brand">BipedV1</span>
  <span class="chip" id="conn"><span class="glyph g-critical">✕</span><span>connecting…</span></span>
  <span class="chip" id="modeChip"><span class="glyph g-muted">■</span><span>mode ?</span></span>

  <span class="spacer"></span>

  <select id="layoutSel" aria-label="Layout"></select>
  <button id="addBtn" title="Add a tile">＋ Tile</button>
  <button id="editBtn" aria-pressed="false" title="Unlock dragging and resizing">Edit</button>
  <button id="themeBtn" title="Theme">◐</button>
  <button id="menuBtn" title="More">⋯</button>

  <div id="menu" class="sheet" hidden
       style="position:absolute; right:.5rem; top:3rem; width:15rem; z-index:60;">
    <div class="body" style="display:flex; flex-direction:column; gap:.35rem;">
      <button id="newLayout">New layout…</button>
      <button id="dupLayout">Duplicate layout…</button>
      <button id="resetLayout">Reset to default tiles</button>
      <button id="delLayout" class="danger">Delete this layout</button>
      <hr style="border:0; border-top:1px solid var(--border); margin:.2rem 0;" />
      <button id="exportBtn">Export layouts…</button>
      <label class="card" style="cursor:pointer; text-align:center;">
        Import layouts…
        <input id="importFile" type="file" accept="application/json" hidden />
      </label>
    </div>
  </div>
</header>

<p id="editHint" class="note" hidden
   style="margin:.4rem .75rem 0; color:var(--ink-2);">
  Editing: drag a tile by its title bar, resize from the corner, ⚙ for settings,
  ✕ to remove. Tiles fall upward into free space, so there is no way to leave a
  gap or an overlap.
</p>

<main class="grid-wrap">
  <div id="grid"></div>
</main>

<div class="scrim" id="scrim" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <header>
      <h2 id="sheetTitle">…</h2>
      <span class="spacer"></span>
      <button id="sheetClose" aria-label="Close">✕</button>
    </header>
    <div class="body" id="sheetBody"></div>
    <footer id="sheetFoot"></footer>
  </div>
</div>

<!-- type="module" so the tile files can import each other. Served over http by
     the launch file's static server, which sets the right MIME type; opening
     index.html straight off the filesystem will NOT work (modules are blocked
     on file:// by CORS). Always reach it through http://<host>:8000/. -->
<script type="module" src="js/app.js"></script>
</body>
</html>
