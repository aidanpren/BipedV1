<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BipedV1 — dashboard</title>

  <!-- vendored locally: the robot has no internet, so no CDN. -->
  <script src="roslib.min.js"></script>

  <style>
    /* Palette roles. Light + dark are each SELECTED steps, not an auto-flip.
       Status hues are fixed and never themed. */
    :root {
      color-scheme: light;
      --plane:   #f9f9f7;
      --surface: #fcfcfb;
      --ink:     #0b0b0b;
      --ink-2:   #52514e;
      --muted:   #898781;
      --grid:    #e1e0d9;
      --axis:    #c3c2b7;
      --border:  rgba(11,11,11,0.10);
      --series:  #2a78d6;
      --good:     #0ca30c;
      --warning:  #fab219;
      --critical: #d03b3b;
    }
    @media (prefers-color-scheme: dark) {
      :root:where(:not([data-theme="light"])) {
        color-scheme: dark;
        --plane:   #0d0d0d;
        --surface: #1a1a19;
        --ink:     #ffffff;
        --ink-2:   #c3c2b7;
        --muted:   #898781;
        --grid:    #2c2c2a;
        --axis:    #383835;
        --border:  rgba(255,255,255,0.10);
        --series:  #3987e5;
      }
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --plane: #0d0d0d; --surface: #1a1a19; --ink: #fff; --ink-2: #c3c2b7;
      --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
      --series: #3987e5;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 1.25rem;
      background: var(--plane); color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      line-height: 1.4;
    }
    .wrap { max-width: 60rem; margin: 0 auto; }

    header {
      display: flex; align-items: center; justify-content: space-between;
      gap: 1rem; flex-wrap: wrap; margin-bottom: 1.25rem;
    }
    h1 { font-size: 1.25rem; margin: 0; letter-spacing: -0.01em; }

    /* Status: colour + SHAPE + WORD. Never hue alone — green/red are
       indistinguishable under red-green CVD (measured ΔE 4.1). */
    .status { display: inline-flex; align-items: center; gap: .45rem;
              font-size: .875rem; color: var(--ink-2); }
    .glyph { font-size: .8rem; line-height: 1; }
    .g-good     { color: var(--good); }
    .g-warning  { color: var(--warning); }
    .g-critical { color: var(--critical); }
    .g-muted    { color: var(--muted); }

    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 1rem 1.15rem; margin-bottom: 1rem;
    }
    .card > h2 {
      margin: 0 0 .75rem; font-size: .7rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: .09em; color: var(--muted);
    }

    /* mode */
    .mode-now { display: flex; align-items: center; gap: .6rem; margin-bottom: .9rem; }
    .mode-name { font-size: 1.5rem; font-weight: 600; letter-spacing: -0.01em; }
    .buttons { display: grid; grid-template-columns: repeat(3, 1fr); gap: .5rem; }
    button {
      min-height: 48px; padding: .7rem .5rem; font: inherit; font-weight: 500;
      color: var(--ink); background: var(--plane);
      border: 1px solid var(--border); border-radius: 8px; cursor: pointer;
    }
    button:hover { border-color: var(--axis); }
    button[aria-pressed="true"] {
      border-color: var(--series); box-shadow: inset 0 0 0 1px var(--series);
    }
    #result { margin: .75rem 0 0; font-size: .8rem; color: var(--ink-2);
              font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

    /* hero figure — exactly one per view */
    .hero-row { display: flex; align-items: baseline; gap: .5rem; }
    .hero { font-size: 3rem; font-weight: 600; letter-spacing: -0.02em; line-height: 1; }
    .hero-unit { font-size: .95rem; color: var(--muted); }
    .spark-meta { display: flex; justify-content: space-between;
                  font-size: .7rem; color: var(--muted); margin-top: .35rem; }

    /* KPI row of stat tiles */
    .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
    .tile .label { font-size: .75rem; color: var(--ink-2); }
    .tile .value { font-size: 1.5rem; font-weight: 600; letter-spacing: -0.01em; }
    .tile .unit  { font-size: .75rem; color: var(--muted); margin-left: .2rem; }
    .tile .stub  { font-size: 1.05rem; font-weight: 400; color: var(--muted); }

    @media (max-width: 34rem) {
      .kpis { grid-template-columns: 1fr 1fr; }
      .buttons { grid-template-columns: 1fr; }
      .hero { font-size: 2.5rem; }
    }
  </style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>BipedV1</h1>
    <span class="status">
      <span class="glyph g-critical" id="connGlyph">✕</span>
      <span id="connText">connecting…</span>
    </span>
  </header>

  <section class="card">
    <h2>Mode</h2>
    <div class="mode-now">
      <span class="glyph g-muted" id="modeGlyph" style="font-size:1.1rem">■</span>
      <span class="mode-name" id="modeName">—</span>
    </div>
    <div class="buttons">
      <button data-mode="disabled"   aria-pressed="false">Disabled</button>
      <button data-mode="teleop"     aria-pressed="false">Teleop</button>
      <button data-mode="autonomous" aria-pressed="false">Autonomous</button>
    </div>
    <p id="result" role="status" aria-live="polite">—</p>
  </section>

  <section class="card">
    <h2>Pitch — last 15 s</h2>
    <div class="hero-row">
      <span class="hero" id="pitch">—</span><span class="hero-unit">rad</span>
    </div>
    <svg id="spark" viewBox="0 0 600 120" preserveAspectRatio="none"
         width="100%" height="120" aria-hidden="true" style="display:block;margin-top:.6rem">
      <line x1="0" y1="60" x2="600" y2="60" stroke="var(--axis)" stroke-width="1" />
      <path id="sparkArea" fill="var(--series)" fill-opacity="0.10" d="" />
      <path id="sparkLine" fill="none" stroke="var(--series)" stroke-width="2"
            stroke-linejoin="round" stroke-linecap="round" d="" />
      <circle id="sparkDot" r="4" fill="var(--series)"
              stroke="var(--surface)" stroke-width="2" cx="-10" cy="60" />
    </svg>
    <div class="spark-meta"><span>+0.4</span><span>0 — upright</span><span>−0.4</span></div>
  </section>

  <section class="card">
    <h2>Telemetry</h2>
    <div class="kpis">
      <div class="tile">
        <div class="label">Pitch rate</div>
        <div class="value"><span id="pitchRate">—</span><span class="unit">rad/s</span></div>
      </div>
      <div class="tile">
        <div class="label">Wheel velocity</div>
        <div class="value"><span id="wheelVel">—</span><span class="unit">m/s</span></div>
      </div>
      <div class="tile">
        <div class="label">Wheel position</div>
        <div class="value"><span id="wheelPos">—</span><span class="unit">m</span></div>
      </div>
    </div>
  </section>

  <section class="card">
    <h2>Power</h2>
    <div class="kpis">
      <div class="tile">
        <div class="label">Battery</div>
        <div class="value stub">N/A</div>
      </div>
      <div class="tile">
        <div class="label">Current</div>
        <div class="value stub">N/A</div>
      </div>
      <div class="tile">
        <div class="label">Source</div>
        <div class="value stub">needs Pico</div>
      </div>
    </div>
  </section>

</div>

<script>
  const WHEEL_RADIUS = 0.105;   // must match balance_controller
  const PITCH_SCALE  = 0.4;     // rad, full-scale of the sparkline (max_lean is 0.3)
  const BUF = 150;              // samples retained (~15 s at the render rate)

  const el  = (id) => document.getElementById(id);
  const set = (id, text) => { el(id).textContent = text; };

  // ---- connection -------------------------------------------------------
  // Derive the bridge host from wherever this page was loaded from, so the
  // SAME page works from the laptop, the Pi, or a phone with no edits.
  const host = window.location.hostname || 'localhost';
  const ros = new ROSLIB.Ros({ url: `ws://${host}:9090` });

  function setConn(glyph, cls, text) {
    el('connGlyph').textContent = glyph;
    el('connGlyph').className = 'glyph ' + cls;
    set('connText', text);
  }
  ros.on('connection', () => setConn('●', 'g-good', `connected · ${host}`));
  ros.on('error',      () => setConn('✕', 'g-critical', 'error — see console'));
  ros.on('close',      () => setConn('✕', 'g-critical', 'disconnected'));

  // ---- /mode ------------------------------------------------------------
  // shape + colour + word, so state never rests on hue alone
  const MODE_STYLE = {
    disabled:   { glyph: '■', cls: 'g-muted'   },
    teleop:     { glyph: '●', cls: 'g-good'    },
    autonomous: { glyph: '◆', cls: 'g-warning' },
  };

  const modeTopic = new ROSLIB.Topic({
    ros: ros, name: '/mode', messageType: 'std_msgs/msg/String',
  });
  modeTopic.subscribe((msg) => {
    const style = MODE_STYLE[msg.data] || { glyph: '?', cls: 'g-muted' };
    el('modeGlyph').textContent = style.glyph;
    el('modeGlyph').className = 'glyph ' + style.cls;
    set('modeName', msg.data);
    // reflect the ROBOT's state, never the click — a rejected request must
    // never look accepted.
    document.querySelectorAll('button[data-mode]').forEach((b) => {
      b.setAttribute('aria-pressed', String(b.dataset.mode === msg.data));
    });
  });

  // ---- /set_mode (service client) ---------------------------------------
  const setModeService = new ROSLIB.Service({
    ros: ros, name: '/set_mode', serviceType: 'robot_interfaces/srv/SetMode',
  });

  function requestMode(mode) {
    set('result', `requesting ${mode}…`);
    const request = new ROSLIB.ServiceRequest({ mode: mode });
    setModeService.callService(request, (res) => {
      // res.success / res.message come straight from SetMode.srv's response
      // half — "no controller present" surfaces here.
      set('result', `${res.success ? '✓' : '✕ rejected —'} ${res.message}`);
    }, (err) => {
      // fires when the CALL fails (service missing, bridge down) — NOT when
      // the robot answers with success=false.
      set('result', `✕ call failed: ${err}`);
    });
  }
  document.querySelectorAll('button[data-mode]').forEach((b) => {
    b.addEventListener('click', () => requestMode(b.dataset.mode));
  });

  // ---- /imu -> pitch + sparkline ----------------------------------------
  // identical math to balance_controller.imu_callback, ported to JS
  const hist = [];
  let latestPitch = null, dirty = false;

  const imuTopic = new ROSLIB.Topic({
    ros: ros, name: '/imu', messageType: 'sensor_msgs/msg/Imu',
  });
  imuTopic.subscribe((msg) => {
    const q = msg.orientation;
    let sinp = 2.0 * (q.w * q.y - q.z * q.x);
    sinp = Math.max(-1.0, Math.min(1.0, sinp));   // clamp — same reason as Python
    latestPitch = Math.asin(sinp);
    set('pitchRate', msg.angular_velocity.y.toFixed(2));
    dirty = true;
  });

  // The IMU arrives ~100 Hz; redrawing SVG that fast would burn a phone's
  // battery for no readability gain. Sample into the buffer on a frame tick.
  function tick() {
    if (dirty && latestPitch !== null) {
      hist.push(latestPitch);
      while (hist.length > BUF) hist.shift();
      set('pitch', latestPitch.toFixed(3));
      draw();
      dirty = false;
    }
    requestAnimationFrame(tick);
  }

  function draw() {
    const W = 600, H = 120, mid = H / 2;
    // fixed symmetric scale: auto-scaling would make tiny wobble look dramatic
    const y = (v) => mid - (Math.max(-PITCH_SCALE, Math.min(PITCH_SCALE, v)) / PITCH_SCALE) * mid;
    const step = W / (BUF - 1);
    const pts = hist.map((v, i) => [i * step, y(v)]);
    if (!pts.length) return;
    const d = pts.map(([x, yy], i) => `${i ? 'L' : 'M'}${x.toFixed(1)},${yy.toFixed(1)}`).join('');
    el('sparkLine').setAttribute('d', d);
    el('sparkArea').setAttribute('d',
      `${d}L${pts[pts.length - 1][0].toFixed(1)},${mid}L0,${mid}Z`);
    const last = pts[pts.length - 1];
    el('sparkDot').setAttribute('cx', last[0].toFixed(1));
    el('sparkDot').setAttribute('cy', last[1].toFixed(1));
  }
  requestAnimationFrame(tick);

  // ---- /joint_states -> wheel position & velocity -----------------------
  const jointTopic = new ROSLIB.Topic({
    ros: ros, name: '/joint_states', messageType: 'sensor_msgs/msg/JointState',
  });
  jointTopic.subscribe((msg) => {
    // parallel arrays: find each wheel by name, then index into position/velocity
    const l = msg.name.indexOf('left_wheel_joint');
    const r = msg.name.indexOf('right_wheel_joint');
    if (l === -1 || r === -1) return;   // JS version of your try/except ValueError
    set('wheelPos', (WHEEL_RADIUS * (msg.position[l] + msg.position[r]) / 2.0).toFixed(2));
    set('wheelVel', (WHEEL_RADIUS * (msg.velocity[l] + msg.velocity[r]) / 2.0).toFixed(2));
  });
</script>
</body>
</html>
